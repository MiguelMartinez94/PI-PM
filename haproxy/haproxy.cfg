global
    log stdout format raw local0
    maxconn 2000

defaults
    log global
    mode http
    option httplog
    option forwardfor
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    default-server init-addr libc,none

frontend http_admin
    bind *:80
    http-request redirect scheme https code 301 if !{ ssl_fc }

frontend https_admin
    bind *:443 ssl crt /usr/local/etc/haproxy/certs/haproxy.pem alpn h2,http/1.1
    default_backend admin_back

frontend http_api
    bind *:8090
    default_backend api_back

backend admin_back
    balance roundrobin
    server admin1 admin-web-1:5000 check
    server admin2 admin-web-2:5000 check

backend api_back
    balance roundrobin
    server api1 api-backend-1:8000 check
    server api2 api-backend-2:8000 check

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
    stats auth admin:admin

frontend prometheus
    bind *:8405
    mode http
    http-request use-service prometheus-exporter
    no log