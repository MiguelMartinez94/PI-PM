global
    log stdout format raw local0
    maxconn 2000

defaults
    log global
    mode http
    option httplog
    option forwardfor
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    default-server init-addr libc,none

frontend http_front
    bind *:80

    acl host_flask hdr(host) -i flask.local
    acl host_api hdr(host) -i api.local

    use_backend flask_back if host_flask
    use_backend api_back if host_api

    default_backend api_back

backend flask_back
    balance roundrobin
    cookie SRV insert indirect nocache
    server flask1 admin-web:5000 check cookie f1

backend api_back
    balance roundrobin
    server api1 api-backend:8000 check

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
    stats auth admin:admin

frontend prometheus
    bind *:8405
    mode http
    http-request use-service prometheus-exporter
    no log
EOF