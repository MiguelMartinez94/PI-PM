services:
  web1:
    image: nginx:alpine
    container_name: web1
    restart: unless-stopped

    volumes:
      - ./web1:/usr/share/nginx/html:ro

    expose:
      - "80"

    networks:
      - proxy_net

  web2:
    image: nginx:alpine
    container_name: web2
    restart: unless-stopped

    volumes:
      - ./web2:/usr/share/nginx/html:ro

    expose:
      - "80"

    networks:
      - proxy_net

  nginx_proxy:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped

    depends_on:
      - web1
      - web2

    ports:
      - "8080:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - proxy_net

  haproxy_proxy:
    image: haproxy:alpine
    container_name: haproxy_proxy
    restart: unless-stopped

    depends_on:
      - web1
      - web2

    ports:
      - "8081:80"

    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

    networks:
      - proxy_net

networks:
  proxy_net:
    driver: bridge