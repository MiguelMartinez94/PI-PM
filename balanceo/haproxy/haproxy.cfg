global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog

    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend http_front
    bind *:80
    default_backend servidores_web

backend servidores_web
    balance roundrobin

    option httpchk GET /
    http-check expect status 200

    http-response set-header X-Backend-Server %[srv_name]

    server servidor1 web1:80 check
    server servidor2 web2:80 check
