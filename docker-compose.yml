version: '3.8'

services:
  # --- 1. TUS APLICACIONES ---
  api-backend:
    build: ./api-backend
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgresql://neondb_owner:npg_j5GMCDdNE0Uu@ep-super-breeze-axu8gq3l-pooler.c-4.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require

  admin-web:
    build: ./admin-web
    expose:
      - "5000"
    environment:
      - FASTAPI_URL=http://haproxy_proxy:80
      - FLASK_ENV=development
      - FLASK_DEBUG=1

  mobile-app:
    build: ./mobile-app
    ports:
      - "8081:8081"
    environment:
      - EXPO_USE_V2_RESOLVER=1
      - REACT_NATIVE_PACKAGER_HOSTNAME=192.168.1.27

  # --- 2. BALANCEADOR DE CARGA ---
  haproxy_proxy:
    image: haproxy:alpine
    container_name: haproxy_proxy
    restart: unless-stopped
    depends_on:
      - api-backend
      - admin-web
    ports:
      - "80:80"     
      - "8404:8404"
      - "8405:8405"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

  # --- 3. MONITOREO ---
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro