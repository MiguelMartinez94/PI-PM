version: '3.8'
services:
  # --- CLONES DEL BACKEND (API) ---
  api-backend-1:
    build:
      context: ./api-backend
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - ./api-backend:/app

  api-backend-2:
    build:
      context: ./api-backend
    ports:
      - "8002:8000" # Puerto externo distinto para evitar choques
    environment:
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - ./api-backend:/app

  # --- CLONES DEL FRONTEND (ADMIN WEB) ---
  admin-web-1:
    build:
      context: ./admin-web
    ports:
      - "5001:5000"
    environment:
      - FASTAPI_URL=${FASTAPI_URL}
      - FLASK_ENV=${FLASK_ENV}
      - FLASK_DEBUG=${FLASK_DEBUG}
    volumes:
      - ./admin-web:/app
    depends_on:
      - api-backend-1
      - api-backend-2

  admin-web-2:
    build:
      context: ./admin-web
    ports:
      - "5002:5000" # Puerto externo distinto
    environment:
      - FASTAPI_URL=${FASTAPI_URL}
      - FLASK_ENV=${FLASK_ENV}
      - FLASK_DEBUG=${FLASK_DEBUG}
    volumes:
      - ./admin-web:/app
    depends_on:
      - api-backend-1
      - api-backend-2

  # --- APLICACIÓN MÓVIL ---
  mobile-app:
    build:
      context: ./mobile-app
    ports:
      - "8081:8081"
    environment:
      - EXPO_USE_V2_RESOLVER=${EXPO_USE_V2_RESOLVER}
      - REACT_NATIVE_PACKAGER_HOSTNAME=${REACT_NATIVE_PACKAGER_HOSTNAME}
      - EXPO_PUBLIC_API_BASE_URL=${EXPO_PUBLIC_API_BASE_URL}
    volumes:
      - ./mobile-app:/app
      - /app/node_modules
    depends_on:
      - api-backend-1
      - api-backend-2

  # --- PROXY Y BALANCEADOR DE CARGA ---
  haproxy_proxy:
    image: haproxy:2.9-alpine
    ports:
      - "80:80"
      - "443:443"
      - "8090:8090"
      - "8404:8404"
      - "8405:8405"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./haproxy/certs:/usr/local/etc/haproxy/certs:ro # Recuperamos tu carpeta de certificados SSL
    depends_on:
      - admin-web-1
      - admin-web-2
      - api-backend-1
      - api-backend-2

  # --- HERRAMIENTAS DE MONITOREO ---
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - haproxy_proxy

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    depends_on:
      - prometheus