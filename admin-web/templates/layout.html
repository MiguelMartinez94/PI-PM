<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - Balonpié</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
    <div class="app-layout">
        
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="http://localhost:8001/uploads/sistema/Logo.jpeg" alt="Logo" style="width: 32px; height: 32px; border-radius: 6px; object-fit: cover;">
                <h2>Balompié</h2>
            </div>
            
            <nav class="sidebar-nav">
                <a href="{{ url_for('dashboard_bp.dashboard') }}" class="nav-item {% if request.endpoint == 'dashboard_bp.dashboard' %}active{% endif %}">
                    <i class="ri-dashboard-line"></i>
                    <span>Dashboard</span>
                </a>
                <a href="{{ url_for('sedes_bp.gestionar_sedes') }}" class="nav-item {% if request.endpoint in ['sedes_bp.gestionar_sedes', 'sedes_bp.registrar_sede'] %}active{% endif %}">
                    <i class="ri-map-pin-line"></i>
                    <span>Sedes</span>
                </a>
                <a href="{{ url_for('torneos_bp.crear_torneo') }}" class="nav-item {% if request.endpoint == 'torneos_bp.crear_torneo' %}active{% endif %}">
                    <i class="ri-trophy-line"></i>
                    <span>Torneos</span>
                </a>
                <a href="{{ url_for('horarios_bp.gestionar_horarios') }}" class="nav-item {% if request.endpoint == 'horarios_bp.gestionar_horarios' %}active{% endif %}">
                    <i class="ri-calendar-line"></i>
                    <span>Horarios</span>
                </a>
                <a href="{{ url_for('torneos_bp.equipos_emparejamientos') }}" class="nav-item {% if request.endpoint in ['torneos_bp.equipos_emparejamientos', 'equipos_bp.gestionar_equipo', 'torneos_bp.aceptar_equipos', 'torneos_bp.cuadro_eliminatorias'] %}active{% endif %}">
                    <i class="ri-team-line"></i>
                    <span>Equipos</span>
                </a>
                <a href="{{ url_for('clasificacion_bp.tabla_clasificacion') }}" class="nav-item {% if request.endpoint == 'clasificacion_bp.tabla_clasificacion' %}active{% endif %}">
                    <i class="ri-bar-chart-box-line"></i>
                    <span>Clasificación</span>
                </a>


                
            </nav>
            
            <div class="sidebar-footer">
                <a href="{{ url_for('auth_bp.logout') }}" class="nav-item logout">
                    <i class="ri-logout-box-r-line"></i>
                    <span>Cerrar Sesión</span>
                </a>
            </div>
        </aside>

        
        <div class="main-wrapper">
            
            <header class="topbar">

                
                <div class="topbar-actions">
                    

                    
                    <div class="user-profile">
                        <div class="user-info">
                            <span class="user-name">Administrador</span>
                        </div>

                    </div>
                </div>
            </header>

            <main class="content-area">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
</body>
</html>
