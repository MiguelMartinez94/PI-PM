<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - PI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-logo">AdminTorneos</div>
            <nav>
                <a href="{{ url_for('dashboard') }}" class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}">Dashboard</a>
                <a href="{{ url_for('crear_torneo') }}" class="nav-link {% if request.endpoint == 'crear_torneo' %}active{% endif %}">Crear Torneo</a>
                <a href="{{ url_for('gestionar_sedes') }}" class="nav-link {% if request.endpoint in ['gestionar_sedes', 'registrar_sede'] %}active{% endif %}">Gestión de Sedes</a>
                <a href="{{ url_for('equipos_emparejamientos') }}" class="nav-link {% if request.endpoint in ['equipos_emparejamientos', 'gestionar_equipo', 'aceptar_equipos'] %}active{% endif %}">Equipos</a>
                <a href="{{ url_for('cuadro_eliminatorias') }}" class="nav-link {% if request.endpoint == 'cuadro_eliminatorias' %}active{% endif %}">Eliminatorias</a>
                <a href="{{ url_for('gestionar_horarios') }}" class="nav-link {% if request.endpoint == 'gestionar_horarios' %}active{% endif %}">Horarios</a>
                <a href="{{ url_for('tabla_clasificacion') }}" class="nav-link {% if request.endpoint == 'tabla_clasificacion' %}active{% endif %}">Clasificación</a>
                <a href="{{ url_for('login') }}" class="nav-link" style="margin-top: auto; color: var(--secondary);">Cerrar Sesión</a>
            </nav>
        </aside>

        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
